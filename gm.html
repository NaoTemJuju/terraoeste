<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de GM</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="top">
      <div>
        <h2>Painel de GM</h2>
        <div class="sub" style="color:#af906a">Configurações globais de Classes e Raças</div>
      </div>
      <div class="header-actions">
        <a class="ghost" href="index.html">⬅ Voltar</a>
      </div>
    </header>

    <section class="card">
      <div class="row" style="gap:1rem; align-items:center;">
        <button id="btnTabCR" class="primary">Classes/Raças</button>
        <span class="muted">Código: 123</span>
      </div>
    </section>

    <section id="tabCR" class="card">
      <h3>Classes</h3>
      <div id="classesList" class="grid-2"></div>
      <h3 style="margin-top:1rem;">Raças</h3>
      <div id="racesList" class="grid-2"></div>
      <div class="row" style="margin-top:1rem; gap:.5rem; flex-wrap:wrap;">
        <button id="btnEnableAll" class="ghost">Habilitar tudo</button>
        <button id="btnDisableAll" class="ghost">Desabilitar tudo</button>
        <span class="spacer"></span>
        <button id="btnSave" class="primary">Salvar (global)</button>
        <button id="btnReload" class="ghost">Recarregar</button>
      </div>
      <p class="muted" style="margin-top:.5rem;">
        As alterações são salvas em KV e passam a valer <strong>na hora</strong> para todos.
      </p>
    </section>
  
    <section id="tabAdd" class="card">
      <h3>Adicionar Classe</h3>
      <div class="grid-2">
        <label class="check" style="display:block;">
          <span>Nome da classe</span>
          <input id="clsName" type="text" placeholder="Ex.: Arqueiro-Sombras" style="width:100%;">
        </label>
        <label class="check" style="display:block;">
          <span>Pontos de Vida (PV) — dado</span>
          <select id="clsHP" style="width:100%;">
            <option value="4">d4</option>
            <option value="6" selected>d6</option>
            <option value="8">d8</option>
            <option value="10">d10</option>
          </select>
        </label>
      </div>

      <h4 style="margin-top:1rem;">Origens (6)</h4>
      <div id="originsWrap" class="grid-2"></div>

      <h4 style="margin-top:1rem;">Línguas</h4>
      <div class="grid-2">
        <div>
          <div class="muted" style="margin-bottom:.25rem;">Concedidas pela classe</div>
          <div id="langGrant" class="grid-2"></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:.25rem;">Extras para escolher</div>
          <label class="check" style="display:block;">
            <span>Comuns (+)</span>
            <input id="langBonusCommon" type="number" min="0" step="1" value="0" style="width:100%;">
          </label>
          <label class="check" style="display:block;">
            <span>Raras (+)</span>
            <input id="langBonusRare" type="number" min="0" step="1" value="0" style="width:100%;">
          </label>
        </div>
      </div>

      <div class="row" style="margin-top:1rem; gap:.5rem; flex-wrap:wrap;">
        <button id="btnAddClass" class="primary">Salvar classe (global)</button>
        <button id="btnListClasses" class="ghost">Atualizar lista</button>
      </div>

      <div id="customClassList" style="margin-top:1rem;"></div>
    </section>

  </div>

  <script src="base.js"></script>
  <script src="gm.js"></script>
</body>
</html>
