<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de GM</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="top">
      <div>
        <h2>Painel de GM</h2>
        <div class="sub" style="color:#af906a">Configurações globais</div>
      </div>
      <div class="header-actions">
        <a class="ghost" href="index.html">⬅ Voltar</a>
      </div>
    </header>

    <section class="card">
      <div class="row" style="gap:1rem; align-items:center;">
        <button id="btnTabCR" class="primary">Classes/Raças</button>
      </div>
    </section>

    <section id="tabCR" class="card">
      <h3>Classes</h3>
      <div id="classesList" class="grid-2"></div>
      <h3 style="margin-top:1rem;">Raças</h3>
      <div id="racesList" class="grid-2"></div>
      <div class="row" style="margin-top:1rem; gap:.5rem; flex-wrap:wrap;">
        <button id="btnEnableAll" class="ghost">Habilitar tudo</button>
        <button id="btnDisableAll" class="ghost">Desabilitar tudo</button>
        <span class="spacer"></span>
        <button id="btnSave" class="primary">Salvar (global)</button>
        <button id="btnReload" class="ghost">Recarregar</button>
      </div>
    </section>

    <section id="tabAdd" class="card">
      <h3>Adicionar Classe</h3>
      <div class="grid-2">
        <div class="field"><label>Nome da classe</label><input id="clsName" class="input" type="text" placeholder="Ex.: Arqueiro-Sombras"></div>
        <div class="field"><label>Pontos de Vida (PV) — dado</label>
          <select id="clsHP" class="input">
            <option value="4">d4</option>
            <option value="6" selected>d6</option>
            <option value="8">d8</option>
            <option value="10">d10</option>
          </select>
        </div>
      </div>

      <h4 style="margin-top:1rem;">Origens (6)</h4>
      <div id="originsWrap" class="grid-3"></div>

      <h4 style="margin-top:1rem;">Línguas</h4>
      <div class="grid-2">
        <div>
          <div class="muted" style="margin-bottom:.25rem;">Concedidas pela classe</div>
          <div id="langGrant" class="grid-auto"></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:.25rem;">Extras para escolher</div>
          <div class="field"><label>Comuns (+)</label><input id="langBonusCommon" class="input small-input" type="number" min="0" step="1" value="0"></div>
          <div class="field"><label>Raras (+)</label><input id="langBonusRare" class="input small-input" type="number" min="0" step="1" value="0"></div>
        </div>
      </div>

      <div class="row" style="margin-top:1rem; gap:.5rem; flex-wrap:wrap;">
        <button id="btnAddClass" class="primary">Salvar classe (global)</button>
        <button id="btnListClasses" class="ghost">Atualizar lista</button>
      </div>

      <div class="row" id="editBanner" style="display:none; gap:.5rem; align-items:center; margin-top:1rem;">
        <strong>Em edição:</strong> <span id="editingName" class="muted"></span>
        <button id="btnCancelEdit" class="ghost">Cancelar edição</button>
      </div>

      <h4 style="margin-top:1rem;">Classes Extras</h4>
      <div id="customClassList" class="grid-2" style="margin-top:.5rem;"></div>
    </section>
  </div>

  <script src="base.js"></script>
  <script src="gm.js"></script>
</body>
</html>
